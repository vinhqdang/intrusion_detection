[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idsbench"
version = "0.1.0"
description = "Leakage-safe benchmark for imbalanced network intrusion detection"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "imbalanced-learn>=0.11",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "torch>=2.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
